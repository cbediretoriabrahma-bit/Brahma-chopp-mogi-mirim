{% extends 'admin_base.html' %}{% block admincontent %}<form class="form" method="post" enctype="multipart/form-data"><h2>{{'Editar produto' if p else 'Novo produto'}}</h2><label>Nome</label><input name="name" value="{{p.name if p else ''}}" required><label>Descrição</label><textarea name="description">{{p.description if p else ''}}</textarea><label>Preço</label><input name="price" value="{{p.price if p else ''}}" required><label>Estoque</label><input name="stock" type="number" value="{{p.stock if p else 0}}" required><label>Foto</label><input type="file" name="image" accept="image/*"><label><input style="width:auto" type="checkbox" name="active" {% if not p or p.active %}checked{% endif %}> Produto ativo</label><button class="btn full">Salvar</button></form>{% endblock %}
