{% extends 'base.html' %}{% block content %}<form class="form" method="post"><h2>Finalizar pedido</h2><p><b>Subtotal:</b> {{subtotal|money}}</p><label><input style="width:auto" type="checkbox" name="installation" value="1"> Preciso de instalação (+ {{installation_fee|money}})</label><label>Forma de pagamento</label><select name="payment_method">{% for m in methods %}<option>{{m}}</option>{% endfor %}</select><p class="muted">Chave Pix: {{pix_key}}</p><label>Observações</label><textarea name="notes" rows="4" placeholder="Endereço de entrega, horário, detalhes do evento..."></textarea><button class="btn full">Confirmar pedido</button><p class="muted">Os pontos são creditados depois que o pagamento for confirmado no painel.</p></form>{% endblock %}
