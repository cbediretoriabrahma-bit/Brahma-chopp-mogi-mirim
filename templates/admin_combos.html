{% extends 'admin_base.html' %}{% block admincontent %}<main class="wrap"><div class="two"><form class="form no-margin" method="post"><h2>🔥 Novo combo</h2><label>Nome</label><input name="title" required><label>Descrição</label><textarea name="description" rows="4"></textarea><div class="form-grid"><div><label>Preço normal</label><input name="original_price" required></div><div><label>Preço do combo</label><input name="price" required></div></div><label>Estoque (-1 = ilimitado)</label><input type="number" name="stock" value="-1"><button class="btn full">Criar combo</button></form><div><h2>Combos cadastrados</h2><div class="stack-list">{% for c in combos %}<div class="list-card"><div><strong>{{c.title}}</strong><span>{{c.price|money}} • Estoque {{c.stock}}</span><small>{{c.description}}</small></div><form method="post" action="/admin/combo/{{c.id}}/toggle"><button class="btn small {% if c.active %}dark{% else %}blue{% endif %}">{{'Desativar' if c.active else 'Ativar'}}</button></form></div>{% else %}<p class="muted">Nenhum combo cadastrado.</p>{% endfor %}</div></div></div></main>{% endblock %}
