{% extends 'admin_base.html' %}{% block admincontent %}<form class="form wide-form" method="post"><h1>Configurações</h1><h3>Pedidos e pagamentos</h3><div class="form-grid"><div><label>Taxa de instalação (R$)</label><input name="installation_fee" value="{{installation_fee}}"></div><div><label>Taxa de entrega (R$)</label><input name="delivery_fee" value="{{delivery_fee}}"></div></div><label>Chave Pix</label><input name="pix_key" value="{{pix_key}}"><label>Métodos de pagamento (separados por vírgula)</label><input name="payment_methods" value="{{payment_methods}}"><label>WhatsApp administrativo</label><input name="whatsapp" value="{{whatsapp}}"><label>Faixas de entrega (separar por |)</label><input name="delivery_slots" value="{{delivery_slots}}"><h3>Clube Brahma</h3><div class="form-grid"><div><label>Quantos reais para gerar 1 ponto</label><input name="points_reais_per_point" value="{{points_reais_per_point}}"></div><div><label>Validade dos pontos (dias)</label><input name="points_validity_days" value="{{points_validity_days}}"></div><div><label>Bônus para quem indica (pontos)</label><input name="referrer_bonus_points" value="{{referrer_bonus_points}}"></div><div><label>Bônus para indicado (pontos)</label><input name="referred_bonus_points" value="{{referred_bonus_points}}"></div></div><h3>Operação</h3><div class="form-grid"><div><label>Alerta de estoque baixo</label><input name="low_stock_threshold" value="{{low_stock_threshold}}"></div><div><label>Estimativa de litros por pessoa</label><input name="event_liters_per_person" value="{{event_liters_per_person}}"></div></div><button class="btn full">Salvar configurações</button><p class="muted small-text">Regra atual sugerida: R$ 10,00 = 1 ponto e validade de 365 dias.</p></form>{% endblock %}
